<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OverTime & Payroll Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f1f5f9; padding: 20px 12px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .dashboard-card { background: #ffffff; width: 100%; max-width: 500px; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        .header-banner { background: #1a73e8; color: white; padding: 20px 16px; text-align: center; }
        .header-banner h2 { font-size: 20px; font-weight: 700; margin-bottom: 3px; }
        .header-banner p { font-size: 13px; opacity: 0.9; }
        .content-area { padding: 20px; }
        
        /* Search Box */
        .search-box { display: flex; gap: 8px; margin-bottom: 16px; }
        .input-box { flex: 1; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; transition: 0.2s; }
        .input-box:focus { border-color: #1a73e8; }
        .btn-search { background: #1a73e8; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-search:hover { background: #1557b0; }
        
        /* Message / Card */
        .msg-text { text-align: center; color: #64748b; font-size: 14px; padding: 30px 10px; }
        .emp-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .profile-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        .profile-bar h3 { font-size: 18px; color: #0f172a; text-transform: capitalize; }
        .profile-bar p { font-size: 13px; color: #64748b; font-weight: 500; margin-top: 2px; }
        .total-pill { background: #eff6ff; color: #1e40af; font-weight: 700; font-size: 14px; padding: 6px 12px; border-radius: 20px; border: 1px solid #bfdbfe; }
        
        /* Table */
        .table-wrap { max-height: 380px; overflow-y: auto; border: 1px solid #cbd5e1; border-radius: 8px; }
        .ot-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        .ot-table th { background: #f8fafc; color: #475569; font-weight: 600; padding: 10px 14px; position: sticky; top: 0; border-bottom: 1px solid #cbd5e1; z-index: 2; }
        .ot-table td { padding: 9px 14px; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
        .ot-table tr:hover { background: #f8fafc; }
        .ot-badge { background: #dcfce7; color: #15803d; font-weight: 700; padding: 3px 8px; border-radius: 6px; display: inline-block; }
        .zero-badge { color: #94a3b8; font-weight: 500; }
    </style>
</head>
<body>

<div class="dashboard-card">
    <div class="header-banner">
        <h2>OverTime & Payroll Portal</h2>
        <p>Live Employee OT Search</p>
    </div>

    <div class="content-area">
        <div class="search-box">
            <input type="text" id="searchInput" class="input-box" placeholder="Enter Casper ID, Emp ID, or Name..." onkeypress="handleKey(event)">
            <button class="btn-search" onclick="doSearch()">Search</button>
        </div>

        <div id="resultsContainer">
            <div class="msg-text">Apna OverTime dekhne ke liye ID daal kar <b>Search</b> karein.</div>
        </div>
    </div>
</div>

<script>
    const SHEET_ID = "1wL36ZedH-wVc7NVTiBzwPGTxYy-8fPCEnUebPmrMZQ0";
    const GID = "552193494";

    // JSONP Sheet Loader (Never blocked by CORS)
    function fetchSheetLive() {
        return new Promise((resolve, reject) => {
            const callbackName = 'gviz_callback_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
            const script = document.createElement('script');
            script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${callbackName}&gid=${GID}&_=${Date.now()}`;

            window[callbackName] = function(json) {
                delete window[callbackName];
                script.remove();

                if (!json || !json.table) {
                    return resolve({ headers: [], rows: [] });
                }

                const table = json.table;
                
                // Extract column labels if available
                let headers = (table.cols || []).map(c => (c && c.label) ? c.label.trim() : '');
                let hasHeaderLabels = headers.some(h => h.length > 0);

                // Extract all rows
                let rows = (table.rows || []).map(r => {
                    return (r.c || []).map(cell => {
                        if (!cell || cell.v === null || cell.v === undefined) return '';
                        return (cell.f ? cell.f : cell.v).toString().trim();
                    });
                });

                // If headers were in the first row instead of cols
                if (!hasHeaderLabels && rows.length > 0) {
                    headers = rows[0];
                    rows = rows.slice(1);
                }

                resolve({ headers, rows });
            };

            script.onerror = function() {
                delete window[callbackName];
                script.remove();
                reject(new Error("Sheet connection failed. Please check sharing permissions."));
            };

            document.body.appendChild(script);
        });
    }

    function handleKey(e) {
        if (e.key === 'Enter') doSearch();
    }

    async function doSearch() {
        const q = document.getElementById('searchInput').value.trim().toLowerCase();
        const container = document.getElementById('resultsContainer');

        if (!q) {
            container.innerHTML = '<div class="msg-text">Kripya Casper ID, Emp ID ya Name enter karein.</div>';
            return;
        }

        container.innerHTML = '<div class="msg-text" style="color:#1a73e8;">Live Google Sheet se data load ho raha hai...</div>';

        try {
            const { headers, rows } = await fetchSheetLive();

            if (!rows || rows.length === 0) {
                container.innerHTML = '<div class="msg-text" style="color:#dc2626;">Sheet khali hai ya connect nahi ho saki.</div>';
                return;
            }

            // Search by Casper ID (Col A/C), Emp ID (Col B), or Name (Col D)
            const empRow = rows.find(r => {
                const c1 = (r[0] || '').toLowerCase();
                const c2 = (r[1] || '').toLowerCase();
                const c3 = (r[2] || '').toLowerCase();
                const c4 = (r[3] || '').toLowerCase();
                return c1 === q || c2 === q || c3 === q || c4.includes(q);
            });

            if (!empRow) {
                container.innerHTML = '<div class="msg-text" style="color:#dc2626;">Koi record nahi mila. Sahi ID enter karein.</div>';
                return;
            }

            const casperId = empRow[0] || empRow[2] || '---';
            const empId = empRow[1] || '---';
            const name = empRow[3] || 'Employee';
            const dept = empRow[4] || 'MH';

            let totalOt = 0;
            let rowsHtml = '';

            // Dates start from Column F (Index 5)
            for (let col = 5; col < headers.length; col++) {
                const dateText = headers[col];
                if (!dateText || dateText.toLowerCase().includes('total')) continue;

                const rawVal = empRow[col] || '';
                const hrs = parseFloat(rawVal) || 0;
                totalOt += hrs;

                rowsHtml += `
                    <tr>
                        <td><strong>${dateText}</strong></td>
                        <td style="text-align:right;">${hrs > 0 ? `<span class="ot-badge">${hrs} Hrs</span>` : `<span class="zero-badge">0 Hrs</span>`}</td>
                    </tr>
                `;
            }

            container.innerHTML = `
                <div class="emp-card">
                    <div class="profile-bar">
                        <div>
                            <h3>${name}</h3>
                            <p>ID: ${casperId} | Emp ID: ${empId} | Dept: ${dept}</p>
                        </div>
                        <div class="total-pill">Total: ${totalOt} Hrs</div>
                    </div>
                    <div class="table-wrap">
                        <table class="ot-table">
                            <thead><tr><th>Date</th><th style="text-align:right;">OT Hours</th></tr></thead>
                            <tbody>${rowsHtml}</tbody>
                        </table>
                    </div>
                </div>
            `;

        } catch (err) {
            console.error(err);
            container.innerHTML = `<div class="msg-text" style="color:#dc2626;">Error: Sheet permissions check karein ("Anyone with the link can view" hona zaroori hai).</div>`;
        }
    }
</script>
</body>
</html>
