<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OverTime & Payroll Portal</title>
    <!-- CSV Parsing के लिए PapaParse CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .dashboard-container { background: #ffffff; width: 100%; max-width: 440px; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .header-banner { background: #1a73e8; color: white; text-align: center; padding: 24px 16px; }
        .header-banner h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .header-banner p { font-size: 13px; opacity: 0.9; }
        .content-area { padding: 20px; }
        
        /* Login Form */
        .login-box { display: flex; flex-direction: column; gap: 12px; }
        .login-box input { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
        .login-box input:focus { border-color: #1a73e8; }
        .btn-primary { background: #1a73e8; color: white; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-primary:hover { background: #1557b0; }
        
        /* Dashboard */
        .profile-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .profile-info h3 { font-size: 18px; color: #0f172a; }
        .profile-info p { font-size: 13px; color: #64748b; font-weight: 500; }
        .btn-logout { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
        
        .tab-nav { display: flex; border-bottom: 1.5px solid #e2e8f0; margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; font-size: 13px; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #1a73e8; border-bottom-color: #1a73e8; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card-stat { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; }
        .card-stat.full-width { grid-column: span 2; }
        .card-stat span { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        .card-stat p { font-size: 18px; font-weight: 700; color: #0f172a; }
        .amount-pending { color: #dc2626 !important; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header-banner">
        <h2>OverTime & Payroll Portal</h2>
        <p>Employee Self-Service Dashboard</p>
    </div>

    <div class="content-area">
        <!-- 1. LOGIN SCREEN (ID + PASSWORD) -->
        <div id="loginSection" class="login-box">
            <input type="text" id="associateIdInput" placeholder="Enter ASSOCIATE ID">
            <input type="password" id="passwordInput" placeholder="Enter Password / DOB">
            <button class="btn-primary" onclick="handleLogin()">Login</button>
        </div>

        <!-- 2. DASHBOARD SCREEN -->
        <div id="dashboardSection" style="display: none;">
            <div class="profile-row">
                <div class="profile-info">
                    <h3 id="empName">---</h3>
                    <p>ID: <span id="empIdDisplay">---</span></p>
                </div>
                <button class="btn-logout" onclick="handleLogout()">Logout</button>
            </div>

            <div class="tab-nav">
                <button class="tab-btn" id="otTabBtn" onclick="toggleTab('ot')">OverTime Details</button>
                <button class="tab-btn active" id="payrollTabBtn" onclick="toggleTab('payroll')">Payroll & Allowances</button>
            </div>

            <!-- Tab 1: Payroll Details -->
            <div id="payrollTab">
                <div class="grid-2">
                    <div class="card-stat"><span>NIGHT SHIFT ALLOW.</span><p id="nightShift">₹0</p></div>
                    <div class="card-stat"><span>FOOD ALLOWANCE</span><p id="foodAllowance">₹0</p></div>
                    <div class="card-stat"><span>ACTIVE BONUS</span><p id="activeBonus">₹0</p></div>
                    <div class="card-stat"><span>B SHIFT INCENTIVE</span><p id="bShift">₹0</p></div>
                    <div class="card-stat"><span>ATT. INCENTIVE</span><p id="attIncentive">₹0</p></div>
                    <div class="card-stat"><span>LOPR DAYS</span><p id="loprDays">0</p></div>
                    <div class="card-stat full-width"><span>PENDING AMOUNT</span><p id="pendingAmount" class="amount-pending">₹0</p></div>
                </div>
            </div>

            <!-- Tab 2: OverTime Details -->
            <div id="otTab" style="display: none;">
                <div class="grid-2">
                    <div class="card-stat full-width"><span>TOTAL OT HOURS</span><p id="otHours">0</p></div>
                    <div class="card-stat full-width"><span>TOTAL OT AMOUNT</span><p id="otAmount">₹0</p></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SHEET_1_URL = 'https://docs.google.com/spreadsheets/d/1wL36ZedH-wVc7NVTiBzwPGTxYy-8fPCEnUebPmrMZQ0/gviz/tq?tqx=out:csv&gid=552193494';
    const SHEET_2_URL = 'https://docs.google.com/spreadsheets/d/1EZm6Kyrp6h4rUBuUv0l7HHd3IRQvqT2-10xs4YzyML0/gviz/tq?tqx=out:csv&gid=0';

    // CSV Fetch Helper
    async function fetchCSV(url) {
        const res = await fetch(`${url}&_=${Date.now()}`);
        const csvText = await res.text();
        return new Promise((resolve) => {
            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: (results) => resolve(results.data)
            });
        });
    }

    // Header Matcher (Header ke spaces aur extra character ignore karke exact value nikalta hai)
    function getColValue(row, ...headers) {
        if (!row) return '';
        const normalizedRow = {};
        Object.keys(row).forEach(k => {
            const cleanKey = k.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            normalizedRow[cleanKey] = row[k];
        });

        for (const h of headers) {
            const cleanH = h.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            if (normalizedRow[cleanH] !== undefined && normalizedRow[cleanH] !== '') {
                return normalizedRow[cleanH].toString().trim();
            }
        }
        return '';
    }

    // Login Handle
    async function handleLogin() {
        const inputId = document.getElementById('associateIdInput').value.trim();
        const inputPass = document.getElementById('passwordInput').value.trim();

        if (!inputId) {
            alert("कृपया ASSOCIATE ID दर्ज करें!");
            return;
        }

        try {
            const [otRows, payrollRows] = await Promise.all([
                fetchCSV(SHEET_1_URL),
                fetchCSV(SHEET_2_URL)
            ]);

            // ASSOCIATE ID से यूजर ढूंढना
            const payrollUser = payrollRows.find(r => getColValue(r, 'ASSOCIATE ID', 'ID', 'EMP ID') === inputId);
            const otUser = otRows.find(r => getColValue(r, 'ASSOCIATE ID', 'ID', 'EMP ID') === inputId);

            if (!payrollUser && !otUser) {
                alert(`ASSOCIATE ID: ${inputId} नहीं मिली!`);
                return;
            }

            // Password Verification (Agar Sheet me Password/DOB/Phone column hai)
            const actualUser = payrollUser || otUser;
            const sheetPassword = getColValue(actualUser, 'PASSWORD', 'DOB', 'MOBILE', 'PHONE');
            
            if (sheetPassword && inputPass && sheetPassword !== inputPass) {
                alert("गलत पासवर्ड! कृपया सही पासवर्ड दर्ज करें।");
                return;
            }

            // Dashboard दिखाना
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';

            // Profile Data
            const name = getColValue(payrollUser, 'NAME', 'ASSOCIATE NAME') || getColValue(otUser, 'NAME', 'ASSOCIATE NAME') || 'Associate';
            document.getElementById('empName').innerText = name;
            document.getElementById('empIdDisplay').innerText = inputId;

            // Payroll Cards Data (Header matching se accurate data aayega)
            if (payrollUser) {
                document.getElementById('nightShift').innerText = '₹' + (getColValue(payrollUser, 'NIGHT SHIFT ALLOW', 'NIGHT SHIFT', 'NIGHT') || '0');
                document.getElementById('foodAllowance').innerText = '₹' + (getColValue(payrollUser, 'FOOD ALLOWANCE', 'FOOD') || '0');
                document.getElementById('activeBonus').innerText = '₹' + (getColValue(payrollUser, 'ACTIVE BONUS', 'BONUS') || '0');
                document.getElementById('bShift').innerText = '₹' + (getColValue(payrollUser, 'B SHIFT INCENTIVE', 'B SHIFT') || '0');
                document.getElementById('attIncentive').innerText = '₹' + (getColValue(payrollUser, 'ATT INCENTIVE', 'ATTENDANCE INCENTIVE', 'ATT') || '0');
                document.getElementById('loprDays').innerText = getColValue(payrollUser, 'LOPR DAYS', 'LOPR') || '0';
                document.getElementById('pendingAmount').innerText = '₹' + (getColValue(payrollUser, 'PENDING AMOUNT', 'PENDING') || '0');
            }

            // OverTime Cards Data
            if (otUser) {
                document.getElementById('otHours').innerText = getColValue(otUser, 'OT HOURS', 'TOTAL OT HOURS', 'HOURS') || '0';
                document.getElementById('otAmount').innerText = '₹' + (getColValue(otUser, 'OT AMOUNT', 'TOTAL OT AMOUNT', 'AMOUNT') || '0');
            }

        } catch (err) {
            console.error(err);
            alert("डेटा लोड करने में समस्या आई।");
        }
    }

    function toggleTab(tab) {
        const payrollTab = document.getElementById('payrollTab');
        const otTab = document.getElementById('otTab');
        const payrollTabBtn = document.getElementById('payrollTabBtn');
        const otTabBtn = document.getElementById('otTabBtn');

        if (tab === 'payroll') {
            payrollTab.style.display = 'block';
            otTab.style.display = 'none';
            payrollTabBtn.classList.add('active');
            otTabBtn.classList.remove('active');
        } else {
            payrollTab.style.display = 'none';
            otTab.style.display = 'block';
            otTabBtn.classList.add('active');
            payrollTabBtn.classList.remove('active');
        }
    }

    function handleLogout() {
        document.getElementById('associateIdInput').value = '';
        document.getElementById('passwordInput').value = '';
        document.getElementById('dashboardSection').style.display = 'none';
        document.getElementById('loginSection').style.display = 'flex';
    }
</script>
</body>
</html>
