<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OverTime & Payroll Portal</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .dashboard-container { background: #ffffff; width: 100%; max-width: 440px; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .header-banner { background: #1a73e8; color: white; text-align: center; padding: 24px 16px; }
        .header-banner h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .header-banner p { font-size: 13px; opacity: 0.9; }
        .content-area { padding: 20px; }
        
        .login-box { display: flex; flex-direction: column; gap: 12px; }
        .login-box input { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
        .login-box input:focus { border-color: #1a73e8; }
        .btn-primary { background: #1a73e8; color: white; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-primary:hover { background: #1557b0; }
        
        .profile-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .profile-info h3 { font-size: 18px; color: #0f172a; }
        .profile-info p { font-size: 13px; color: #64748b; font-weight: 500; }
        .btn-logout { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
        
        .tab-nav { display: flex; border-bottom: 1.5px solid #e2e8f0; margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; font-size: 13px; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #1a73e8; border-bottom-color: #1a73e8; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card-stat { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; }
        .card-stat.full-width { grid-column: span 2; }
        .card-stat span { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        .card-stat p { font-size: 18px; font-weight: 700; color: #0f172a; }
        .amount-pending { color: #dc2626 !important; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header-banner">
        <h2>OverTime & Payroll Portal</h2>
        <p>Employee Self-Service Dashboard</p>
    </div>

    <div class="content-area">
        <!-- 1. LOGIN SECTION -->
        <div id="loginSection" class="login-box">
            <input type="text" id="associateIdInput" placeholder="Enter ASSOCIATE ID">
            <input type="password" id="passwordInput" placeholder="Enter Password (Optional)">
            <button class="btn-primary" onclick="handleLogin()">Login</button>
        </div>

        <!-- 2. DASHBOARD SECTION -->
        <div id="dashboardSection" style="display: none;">
            <div class="profile-row">
                <div class="profile-info">
                    <h3 id="empName">---</h3>
                    <p>ID: <span id="empIdDisplay">---</span></p>
                </div>
                <button class="btn-logout" onclick="handleLogout()">Logout</button>
            </div>

            <div class="tab-nav">
                <button class="tab-btn" id="otTabBtn" onclick="toggleTab('ot')">OverTime Details</button>
                <button class="tab-btn active" id="payrollTabBtn" onclick="toggleTab('payroll')">Payroll & Allowances</button>
            </div>

            <!-- Tab 1: Payroll -->
            <div id="payrollTab">
                <div class="grid-2">
                    <div class="card-stat"><span>NIGHT SHIFT ALLOW.</span><p id="nightShift">₹0</p></div>
                    <div class="card-stat"><span>FOOD ALLOWANCE</span><p id="foodAllowance">₹0</p></div>
                    <div class="card-stat"><span>ACTIVE BONUS</span><p id="activeBonus">₹0</p></div>
                    <div class="card-stat"><span>B SHIFT INCENTIVE</span><p id="bShift">₹0</p></div>
                    <div class="card-stat"><span>ATT. INCENTIVE</span><p id="attIncentive">₹0</p></div>
                    <div class="card-stat"><span>LOPR DAYS</span><p id="loprDays">0</p></div>
                    <div class="card-stat full-width"><span>PENDING AMOUNT</span><p id="pendingAmount" class="amount-pending">₹0</p></div>
                </div>
            </div>

            <!-- Tab 2: OverTime -->
            <div id="otTab" style="display: none;">
                <div class="grid-2">
                    <div class="card-stat full-width"><span>TOTAL OT HOURS</span><p id="otHours">0</p></div>
                    <div class="card-stat full-width"><span>TOTAL OT AMOUNT</span><p id="otAmount">₹0</p></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const URL_OT = 'https://docs.google.com/spreadsheets/d/1wL36ZedH-wVc7NVTiBzwPGTxYy-8fPCEnUebPmrMZQ0/gviz/tq?tqx=out:json&gid=552193494';
    const URL_PAYROLL = 'https://docs.google.com/spreadsheets/d/1EZm6Kyrp6h4rUBuUv0l7HHd3IRQvqT2-10xs4YzyML0/gviz/tq?tqx=out:json&gid=0';

    // Sheet ko Header Names ke sath parse karna
    async function fetchSheetObjects(url) {
        const res = await fetch(`${url}&_=${Date.now()}`);
        const text = await res.text();
        const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const data = JSON.parse(jsonStr);

        // Header Labels extract karna
        let headers = data.table.cols.map(c => (c.label || '').toUpperCase().trim());

        let rows = data.table.rows.map(row => 
            row.c ? row.c.map(cell => (cell && cell.v !== null && cell.v !== undefined) ? cell.v.toString().trim() : '') : []
        );

        // Agar headers cols me nahi mile, to pehli row ko header manna
        if (headers.every(h => h === '') && rows.length > 0) {
            headers = rows[0].map(h => h.toUpperCase().trim());
            rows = rows.slice(1);
        }

        return rows.map(r => {
            const obj = {};
            headers.forEach((h, idx) => {
                const cleanKey = h.replace(/[^A-Z0-9]/g, '');
                if (cleanKey) obj[cleanKey] = r[idx] || '';
            });
            // Raw array bhi save rakhein
            obj._raw = r;
            return obj;
        });
    }

    // Header Matcher Helper
    function getVal(rowObj, ...keywords) {
        if (!rowObj) return '';
        for (const kw of keywords) {
            const target = kw.toUpperCase().replace(/[^A-Z0-9]/g, '');
            for (const key in rowObj) {
                if (key !== '_raw' && key.includes(target) && rowObj[key] !== '') {
                    return rowObj[key];
                }
            }
        }
        return '';
    }

    async function handleLogin() {
        const inputId = document.getElementById('associateIdInput').value.trim();
        if (!inputId) {
            alert("कृपया ASSOCIATE ID दर्ज करें!");
            return;
        }

        try {
            const [otData, payrollData] = await Promise.all([
                fetchSheetObjects(URL_OT),
                fetchSheetObjects(URL_PAYROLL)
            ]);

            // ASSOCIATE ID match karna
            const payrollRow = payrollData.find(r => 
                getVal(r, 'ASSOCIATEID', 'ID', 'EMPID') === inputId || (r._raw && r._raw.includes(inputId))
            );

            const otRow = otData.find(r => 
                getVal(r, 'ASSOCIATEID', 'ID', 'EMPID') === inputId || (r._raw && r._raw.includes(inputId))
            );

            if (!payrollRow && !otRow) {
                alert(`ASSOCIATE ID: ${inputId} का डेटा नहीं मिला!`);
                return;
            }

            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';

            // Profile info
            document.getElementById('empName').innerText = getVal(payrollRow, 'NAME', 'ASSOCIATENAME') || getVal(otRow, 'NAME', 'ASSOCIATENAME') || 'Associate';
            document.getElementById('empIdDisplay').innerText = inputId;

            // Payroll Cards Data (Exact Header Match)
            if (payrollRow) {
                document.getElementById('nightShift').innerText = '₹' + (getVal(payrollRow, 'NIGHTSHIFTALLOW', 'NIGHTSHIFT', 'NIGHT') || '0');
                document.getElementById('foodAllowance').innerText = '₹' + (getVal(payrollRow, 'FOODALLOWANCE', 'FOOD') || '0');
                document.getElementById('activeBonus').innerText = '₹' + (getVal(payrollRow, 'ACTIVEBONUS', 'ACTIVE') || '0');
                document.getElementById('bShift').innerText = '₹' + (getVal(payrollRow, 'BSHIFTINCENTIVE', 'BSHIFT') || '0');
                document.getElementById('attIncentive').innerText = '₹' + (getVal(payrollRow, 'ATTINCENTIVE', 'ATTENDANCE') || '0');
                document.getElementById('loprDays').innerText = getVal(payrollRow, 'LOPRDAYS', 'LOPR') || '0';
                document.getElementById('pendingAmount').innerText = '₹' + (getVal(payrollRow, 'PENDINGAMOUNT', 'PENDING') || '0');
            }

            // OverTime Cards Data
            if (otRow) {
                document.getElementById('otHours').innerText = getVal(otRow, 'OTHOURS', 'TOTALOT', 'HOURS') || '0';
                document.getElementById('otAmount').innerText = '₹' + (getVal(otRow, 'OTAMOUNT', 'TOTALAMOUNT', 'AMOUNT') || '0');
            }

        } catch (err) {
            console.error("Fetch Error:", err);
            alert("डेटा लोड करने में समस्या आई।");
        }
    }

    function toggleTab(tab) {
        document.getElementById('payrollTab').style.display = tab === 'payroll' ? 'block' : 'none';
        document.getElementById('otTab').style.display = tab === 'ot' ? 'block' : 'none';
        document.getElementById('payrollTabBtn').classList.toggle('active', tab === 'payroll');
        document.getElementById('otTabBtn').classList.toggle('active', tab === 'ot');
    }

    function handleLogout() {
        document.getElementById('associateIdInput').value = '';
        const pass = document.getElementById('passwordInput');
        if (pass) pass.value = '';
        document.getElementById('dashboardSection').style.display = 'none';
        document.getElementById('loginSection').style.display = 'flex';
    }
</script>
</body>
</html>
