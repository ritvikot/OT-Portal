<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- 1. LOGIN SCREEN -->
  <div id="loginCard" class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
    <h2 class="text-2xl font-bold text-center text-blue-400 mb-6">Employee Login</h2>
    
    <div class="space-y-4">
      <div>
        <label class="text-sm font-medium text-slate-300">User ID (Casper / Emp ID)</label>
        <input type="text" id="loginUser" placeholder="Enter your ID" 
          class="w-full mt-1 p-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-white">
      </div>
      <div>
        <label class="text-sm font-medium text-slate-300">Password</label>
        <input type="password" id="loginPass" placeholder="••••••••" 
          class="w-full mt-1 p-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-white">
      </div>
      <button onclick="handleLogin()" id="loginBtn"
        class="w-full py-3 bg-blue-600 hover:bg-blue-700 font-semibold rounded-lg transition duration-200 shadow-md">
        Login & View Details
      </button>
    </div>
    <p id="loginMsg" class="mt-4 text-sm text-center text-red-400 hidden"></p>
  </div>

  <!-- 2. MY RECORDS DASHBOARD -->
  <div id="portalCard" class="hidden bg-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-lg border border-slate-700">
    <div class="flex justify-between items-center pb-4 border-b border-slate-700 mb-4">
      <div>
        <h3 class="text-xl font-bold text-white">My Details</h3>
        <p class="text-xs text-slate-400">Logged in ID: <span id="activeUser" class="text-blue-400 font-medium"></span></p>
      </div>
      <button onclick="handleLogout()" class="text-xs bg-red-600/20 text-red-400 hover:bg-red-600/30 px-3 py-1.5 rounded-lg border border-red-500/30">
        Logout
      </button>
    </div>

    <!-- Data List -->
    <div id="resultContent" class="bg-slate-900 p-4 rounded-xl border border-slate-700/80 space-y-2 max-h-[70vh] overflow-y-auto">
      <!-- Records load here automatically -->
    </div>
  </div>

  <script>
    // आपका नया Google Apps Script URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzYKnkEwr2phb-FhUm72yq7PW_-ARI5DfotYqex6T3KNZOsCoEcpR35pzBZhZnevnWk/exec";

    async function handleLogin() {
      const user = document.getElementById("loginUser").value.trim();
      const pass = document.getElementById("loginPass").value.trim();
      const msg = document.getElementById("loginMsg");
      const btn = document.getElementById("loginBtn");

      if (!user || !pass) {
        msg.textContent = "Please enter both ID and Password.";
        msg.classList.remove("hidden");
        return;
      }

      btn.textContent = "Verifying & Loading Data...";
      btn.disabled = true;
      msg.classList.add("hidden");

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ username: user, password: pass })
        });
        const response = await res.json();

        if (response.success) {
          document.getElementById("activeUser").textContent = user;
          document.getElementById("loginCard").classList.add("hidden");
          document.getElementById("portalCard").classList.remove("hidden");

          const resultContent = document.getElementById("resultContent");
          if (response.data) {
            let html = `<div class="grid grid-cols-1 gap-2">`;
            for (const [col, val] of Object.entries(response.data)) {
              html += `
                <div class="flex justify-between py-2 border-b border-slate-800 text-sm">
                  <span class="text-slate-400 font-medium">${col}:</span>
                  <span class="text-slate-100 font-semibold">${val || "-"}</span>
                </div>`;
            }
            html += `</div>`;
            resultContent.innerHTML = html;
          } else {
            resultContent.innerHTML = `<p class="text-amber-400 text-center py-4">Login successful, but no records found for this ID in Data sheet.</p>`;
          }
        } else {
          msg.textContent = response.message || "Invalid credentials.";
          msg.classList.remove("hidden");
        }
      } catch (err) {
        msg.textContent = "Error connecting to server. Please try again.";
        msg.classList.remove("hidden");
      } finally {
        btn.textContent = "Login & View Details";
        btn.disabled = false;
      }
    }

    function handleLogout() {
      document.getElementById("loginUser").value = "";
      document.getElementById("loginPass").value = "";
      document.getElementById("portalCard").classList.add("hidden");
      document.getElementById("loginCard").classList.remove("hidden");
    }
  </script>
</body>
</html>
