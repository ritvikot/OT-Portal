<html lang="en">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f1f5f9; padding: 20px 12px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .dashboard-card { background: #ffffff; width: 100%; max-width: 500px; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        .header-banner { background: #1a73e8; color: white; padding: 20px 16px; text-align: center; }
        .header-banner h2 { font-size: 20px; font-weight: 700; margin-bottom: 3px; }
        .header-banner p { font-size: 13px; opacity: 0.9; }
        .content-area { padding: 20px; }
        
        /* Search Box */
        .search-box { display: flex; gap: 8px; margin-bottom: 16px; }
        .input-box { flex: 1; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; transition: 0.2s; }
        .input-box:focus { border-color: #1a73e8; }
        .btn-search { background: #1a73e8; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-search:hover { background: #1557b0; }
        
        /* Result Item */
        .msg-text { text-align: center; color: #64748b; font-size: 14px; padding: 30px 10px; }
        .emp-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .profile-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        .profile-bar h3 { font-size: 18px; color: #0f172a; text-transform: capitalize; }
        .profile-bar p { font-size: 13px; color: #64748b; font-weight: 500; margin-top: 2px; }
        .total-pill { background: #eff6ff; color: #1e40af; font-weight: 700; font-size: 14px; padding: 6px 12px; border-radius: 20px; border: 1px solid #bfdbfe; }
        
        /* Table */
        .table-wrap { max-height: 380px; overflow-y: auto; border: 1px solid #cbd5e1; border-radius: 8px; }
        .ot-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        .ot-table th { background: #f8fafc; color: #475569; font-weight: 600; padding: 10px 14px; position: sticky; top: 0; border-bottom: 1px solid #cbd5e1; z-index: 2; }
        .ot-table td { padding: 9px 14px; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
        .ot-table tr:hover { background: #f8fafc; }
        .ot-badge { background: #dcfce7; color: #15803d; font-weight: 700; padding: 3px 8px; border-radius: 6px; display: inline-block; }
        .zero-badge { color: #94a3b8; font-weight: 500; }
    </style>

    function handleKey(e) {

    function doSearch() {
        const q = document.getElementById('searchInput').value.trim().toLowerCase();
        const container = document.getElementById('resultsContainer');

        if (!q) {
            container.innerHTML = '<div class="msg-text">Kripya Casper ID ya Emp ID enter karein.</div>';
            return;
        }

        // Exact match single employee only
        const matchKey = Object.keys(DB).find(k => k.toLowerCase() === q || (DB[k].empId && DB[k].empId.toLowerCase() === q));

        if (!matchKey) {
            container.innerHTML = '<div class="msg-text" style="color:#dc2626;">Koi record nahi mila. Sahi ID enter karein.</div>';
            return;
        }

        const emp = DB[matchKey];
        let totalOt = 0;
        let rowsHtml = '';

        DATES.forEach(d => {
            const hrs = (emp.ot && emp.ot[d]) ? parseFloat(emp.ot[d]) : 0;
            totalOt += hrs;
            rowsHtml += `
                <tr>
                    <td><strong>${d}</strong></td>
                    <td style="text-align:right;">${hrs > 0 ? `<span class="ot-badge">${hrs} Hrs</span>` : `<span class="zero-badge">0 Hrs</span>`}</td>
                </tr>
            `;
        });

        container.innerHTML = `
            <div class="emp-card">
                <div class="profile-bar">
                    <div>
                        <h3>${emp.name}</h3>
                        <p>ID: ${matchKey} | Emp ID: ${emp.empId} | Dept: ${emp.dept}</p>
                    </div>
                    <div class="total-pill">Total: ${totalOt} Hrs</div>
                </div>
                <div class="table-wrap">
                    <table class="ot-table">
                        <thead><tr><th>Date</th><th style="text-align:right;">OT Hours</th></tr></thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                </div>
            </div>
        `;
