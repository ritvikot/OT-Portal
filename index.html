<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Self Service Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: #0f172a; color: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

    /* Search Card */
    .portal-card { background: #ffffff; width: 100%; max-width: 420px; padding: 32px 28px; border-radius: 16px; box-shadow: 0 20px 30px rgba(0,0,0,0.3); }
    .portal-card h2 { font-size: 1.5rem; font-weight: 700; color: #0f172a; text-align: center; }
    .portal-card p { font-size: 0.85rem; color: #64748b; text-align: center; margin: 6px 0 24px 0; }
    
    .input-field { margin-bottom: 16px; }
    .input-field label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: #334155; }
    .input-field input { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; }
    .input-field input:focus { border-color: #2563eb; }

    .btn-search { width: 100%; padding: 12px; background: #2563eb; color: #ffffff; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    .btn-search:hover { background: #1d4ed8; }
    .msg-alert { padding: 10px; border-radius: 6px; font-size: 0.85rem; text-align: center; margin-top: 14px; display: none; background: #fee2e2; color: #b91c1c; }

    /* Dashboard */
    .result-container { display: none; width: 100%; max-width: 1000px; margin: auto; }
    .res-header { background: #1e293b; color: #ffffff; padding: 18px 24px; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center; }
    .res-header h2 { font-size: 1.3rem; }
    .btn-back { background: #ef4444; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    .btn-back:hover { background: #dc2626; }

    .res-body { background: #ffffff; padding: 24px; border-radius: 0 0 12px 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    
    /* Stats Grids */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; }
    .stat-box span { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; }
    .stat-box h3 { font-size: 1.4rem; color: #0f172a; margin-top: 6px; font-weight: 700; }

    /* Tabs */
    .tab-nav { display: flex; gap: 10px; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; }
    .tab-btn { padding: 10px 20px; font-size: 0.9rem; font-weight: 600; color: #64748b; background: none; border: none; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .table-responsive { overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px; max-height: 520px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; white-space: nowrap; }
    th, td { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { background: #1e293b; color: #ffffff; font-weight: 600; position: sticky; top: 0; z-index: 5; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background: #f8fafc; }
    
    .has-ot { background-color: #ecfdf5 !important; font-weight: 600; color: #059669; }
    .badge-ot { background: #10b981; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; }
  </style>
</head>
<body>

  <!-- Search Card -->
  <div class="portal-card" id="searchBox">
    <h2>Employee Portal</h2>
    <p>Apna data dekhne ke liye ID enter karein</p>

    <div class="input-field">
      <label>User ID / Casper ID</label>
      <input type="text" id="empIdInput" placeholder="e.g. 2333480" onkeypress="handleKey(event)" />
    </div>

    <button class="btn-search" id="submitBtn" onclick="searchRecord()">View Details</button>
    <div class="msg-alert" id="errorNotice">Record nahi mila! Sahi ID daalein.</div>
  </div>

  <!-- Dashboard -->
  <div class="result-container" id="resultBox">
    <div class="res-header">
      <div>
        <h2 id="dispName">Welcome</h2>
        <span id="dispId" style="color: #94a3b8; font-size: 0.85rem;"></span>
      </div>
      <button class="btn-back" onclick="goBack()">New Search</button>
    </div>

    <div class="res-body">
      <!-- Tab Navigation -->
      <div class="tab-nav">
        <button class="tab-btn active" onclick="switchView('tab-ot', this)">OverTime Summary</button>
        <button class="tab-btn" onclick="switchView('tab-pay', this)">Payroll Summary</button>
      </div>

      <!-- ================= TAB 1: OVERTIME ONLY ================= -->
      <div class="tab-content active" id="tab-ot">
        <div class="stats-grid">
          <div class="stat-box">
            <span>Total OverTime</span>
            <h3 id="cardOT">0 Hrs</h3>
          </div>
          <div class="stat-box">
            <span>OT Days Worked</span>
            <h3 id="cardOTDays">0 Days</h3>
          </div>
        </div>

        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th style="width: 50px;">#</th>
                <th>Date</th>
                <th>OverTime Hours</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="otDateWiseBody"></tbody>
          </table>
        </div>
      </div>

      <!-- ================= TAB 2: PAYROLL ONLY ================= -->
      <div class="tab-content" id="tab-pay">
        <div class="stats-grid">
          <div class="stat-box">
            <span>Night Shift Allowance</span>
            <h3 id="cardNight">₹0</h3>
          </div>
          <div class="stat-box">
            <span>Food Allowance</span>
            <h3 id="cardFood">₹0</h3>
          </div>
          <div class="stat-box">
            <span>Active Bonus</span>
            <h3 id="cardBonus">₹0</h3>
          </div>
          <div class="stat-box">
            <span>Female Attendance Inc.</span>
            <h3 id="cardFemaleInc">₹0</h3>
          </div>
        </div>

        <div class="table-responsive">
          <table>
            <thead id="payHead"></thead>
            <tbody id="payBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    const SHEET_OT_ID = '1wL36ZedH-wVc7NVTiBzwPGTxYy-8fPCEnUebPmrMZQ0';
    const SHEET_PAY_ID = '1EZm6Kyrp6h4rUBuUv0l7HHd3IRQvqT2-10xs4YzyML0';

    function handleKey(e) {
      if (e.key === 'Enter') searchRecord();
    }

    function switchView(tabId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    async function fetchGViz(sheetId, tab) {
      // headers=1 ensure karta hai ki row 1 as column labels aaye
      const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(tab)}`;
      const res = await fetch(url);
      const txt = await res.text();
      const parsed = JSON.parse(txt.substring(47).slice(0, -2));
      return { cols: parsed.table.cols, rows: parsed.table.rows };
    }

    async function searchRecord() {
      const queryId = document.getElementById('empIdInput').value.trim();
      const err = document.getElementById('errorNotice');
      const btn = document.getElementById('submitBtn');

      if (!queryId) {
        err.innerText = "Kripya ID daalein!";
        err.style.display = 'block';
        return;
      }

      err.style.display = 'none';
      btn.innerText = 'Searching...';

      try {
        const [otData, payData] = await Promise.all([
          fetchGViz(SHEET_OT_ID, 'Data'),
          fetchGViz(SHEET_PAY_ID, 'Sheet1')
        ]);

        // 1. Match OT Row
        let otRow = null;
        let otHeaders = otData.cols.map(c => c.label);

        // Agar GViz first row ko labels me nahi la pata to row[0] se read karein
        let otDataRows = otData.rows;
        if (otDataRows.length > 0 && String(otDataRows[0].c[0]?.v).toLowerCase() === 'casper') {
          otHeaders = otDataRows[0].c.map(c => c ? (c.f || c.v || '') : '');
          otDataRows = otDataRows.slice(1);
        }

        otDataRows.forEach(r => {
          const c0 = String(r.c[0] ? (r.c[0].f || r.c[0].v || '') : '').trim();
          const c1 = String(r.c[1] ? (r.c[1].f || r.c[1].v || '') : '').trim();
          if (c0.toLowerCase() === queryId.toLowerCase() || c1.toLowerCase() === queryId.toLowerCase()) {
            otRow = r;
          }
        });

        // 2. Match Payroll Row
        let payRow = null;
        let payHeaders = payData.cols.map(c => c.label);
        let payDataRows = payData.rows;

        if (payDataRows.length > 0 && String(payDataRows[0].c[0]?.v).toLowerCase().includes('associate')) {
          payHeaders = payDataRows[0].c.map(c => c ? (c.f || c.v || '') : '');
          payDataRows = payDataRows.slice(1);
        }

        payDataRows.forEach(r => {
          const c0 = String(r.c[0] ? (r.c[0].f || r.c[0].v || '') : '').trim();
          if (c0.toLowerCase() === queryId.toLowerCase()) {
            payRow = r;
          }
        });

        if (!otRow && !payRow) {
          err.innerText = "Is ID ka koi record nahi mila!";
          err.style.display = 'block';
          btn.innerText = 'View Details';
          return;
        }

        // Title Info
        const name = (otRow && otRow.c[3] ? (otRow.c[3].f || otRow.c[3].v) : '') || 
                     (payRow && payRow.c[1] ? (payRow.c[1].f || payRow.c[1].v) : '') || 'Employee Details';
        document.getElementById('dispName').innerText = `${name}`;
        document.getElementById('dispId').innerText = `Searched ID: ${queryId}`;

        // ---------------- OVERTIME PROCESSING ----------------
        const otDateBody = document.getElementById('otDateWiseBody');
        let otDateHtml = '';
        let totalOtCount = 0;
        let otDaysCount = 0;

        if (otRow) {
          let sNo = 1;
          const totalCols = otRow.c.length;
          // Dates index 5 se lekar second last column tak hain
          for (let i = 5; i < totalCols - 1; i++) {
            const dateLabel = otHeaders[i] || `Date ${i - 4}`;
            const cellVal = otRow.c[i] ? (otRow.c[i].f !== undefined ? otRow.c[i].f : otRow.c[i].v) : '';
            const numVal = parseFloat(cellVal) || 0;
            const isOt = numVal > 0;

            if (isOt) otDaysCount++;

            otDateHtml += `
              <tr class="${isOt ? 'has-ot' : ''}">
                <td>${sNo++}</td>
                <td><strong>${dateLabel}</strong></td>
                <td>${cellVal ? `${cellVal} Hrs` : '-'}</td>
                <td>${isOt ? '<span class="badge-ot">OT Added</span>' : '<span style="color:#94a3b8;">Normal</span>'}</td>
              </tr>
            `;
          }
          const lastCell = otRow.c[totalCols - 1];
          totalOtCount = lastCell ? (lastCell.f || lastCell.v || 0) : 0;
        } else {
          otDateHtml = '<tr><td colspan="4" style="text-align:center;">Koi OverTime record nahi mila.</td></tr>';
        }

        otDateBody.innerHTML = otDateHtml;
        document.getElementById('cardOT').innerText = `${totalOtCount} Hrs`;
        document.getElementById('cardOTDays').innerText = `${otDaysCount} Days`;

        // ---------------- PAYROLL PROCESSING (OT Excluded) ----------------
        const payHead = document.getElementById('payHead');
        const payBody = document.getElementById('payBody');

        // Payroll Columns jisme se OT column ko filter kar diya gaya hai
        const excludedPayCols = ['OT']; 
        let validPayIndexes = [];

        let payH = '<tr>';
        payHeaders.forEach((label, idx) => {
          if (!excludedPayCols.includes(label?.trim())) {
            validPayIndexes.push(idx);
            payH += `<th>${label || `Col ${idx+1}`}</th>`;
          }
        });
        payH += '</tr>';
        payHead.innerHTML = payH;

        if (payRow) {
          let payB = '<tr>';
          validPayIndexes.forEach(i => {
            const cell = payRow.c[i];
            const val = cell ? (cell.f !== undefined ? cell.f : (cell.v !== null ? cell.v : '')) : '';
            payB += `<td>${val}</td>`;
          });
          payB += '</tr>';
          payBody.innerHTML = payB;

          // Top Cards
          document.getElementById('cardFemaleInc').innerText = `₹${payRow.c[3] ? (payRow.c[3].v || 0) : 0}`;
          document.getElementById('cardNight').innerText = `₹${payRow.c[4] ? (payRow.c[4].v || 0) : 0}`;
          document.getElementById('cardFood').innerText = `₹${payRow.c[5] ? (payRow.c[5].v || 0) : 0}`;
          document.getElementById('cardBonus').innerText = `₹${payRow.c[7] ? (payRow.c[7].v || 0) : 0}`;
        } else {
          payBody.innerHTML = '<tr><td colspan="100%" style="text-align:center;">Koi Payroll record nahi mila.</td></tr>';
          document.getElementById('cardFemaleInc').innerText = '₹0';
          document.getElementById('cardNight').innerText = '₹0';
          document.getElementById('cardFood').innerText = '₹0';
          document.getElementById('cardBonus').innerText = '₹0';
        }

        // Show Dashboard
        document.getElementById('searchBox').style.display = 'none';
        document.getElementById('resultBox').style.display = 'block';
        document.body.style.alignItems = 'flex-start';

      } catch (e) {
        console.error(e);
        err.innerText = "Data load karne me problem aayi. Sheet check karein.";
        err.style.display = 'block';
      }
      btn.innerText = 'View Details';
    }

    function goBack() {
      document.getElementById('empIdInput').value = '';
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('searchBox').style.display = 'block';
      document.body.style.alignItems = 'center';
    }
  </script>
</body>
</html>
