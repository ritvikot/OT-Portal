<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OverTime & Payroll Portal</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .dashboard-container { background: #ffffff; width: 100%; max-width: 480px; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .header-banner { background: #1a73e8; color: white; text-align: center; padding: 22px 16px; }
        .header-banner h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .header-banner p { font-size: 13px; opacity: 0.9; }
        .content-area { padding: 20px; }
        
        /* Login */
        .login-box { display: flex; flex-direction: column; gap: 12px; }
        .login-box input { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
        .login-box input:focus { border-color: #1a73e8; }
        .btn-primary { background: #1a73e8; color: white; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-primary:hover { background: #1557b0; }
        
        /* Profile Header */
        .profile-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .profile-info h3 { font-size: 18px; color: #0f172a; margin-bottom: 3px; }
        .profile-info p { font-size: 13px; color: #64748b; font-weight: 500; }
        .btn-logout { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
        
        /* Tabs */
        .tab-nav { display: flex; border-bottom: 1.5px solid #e2e8f0; margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; font-size: 13px; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #1a73e8; border-bottom-color: #1a73e8; }
        
        /* Cards */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card-stat { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; }
