<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Self Service Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <script>
    const SHEET_OT_ID = '1wL36ZedH-wVc7NVTiBzwPGTxYy-8fPCEnUebPmrMZQ0';
    const SHEET_PAY_ID = '1EZm6Kyrp6h4rUBuUv0l7HHd3IRQvqT2-10xs4YzyML0';

    const CYCLE_DATES = [
      "21-October-26", "22-October-26", "23-October-26", "24-October-26", "25-October-26",
      "26-October-26", "27-October-26", "28-October-26", "29-October-26", "30-October-26", "31-October-26",
      "1-November-26", "2-November-26", "3-November-26", "4-November-26", "5-November-26",
      "6-November-26", "7-November-26", "8-November-26", "9-November-26", "10-November-26",
      "11-November-26", "12-November-26", "13-November-26", "14-November-26", "15-November-26",
      "16-November-26", "17-November-26", "18-November-26", "19-November-26", "20-November-26"
    ];

    const payCols = [
      { idx: 0, label: "VENDOR EMPLOYEE ID" },          // Col A
      { idx: 1, label: "ASSOCIATE ID" },                // Col B
      { idx: 2, label: "FIRST NAME" },                  // Col C
      { idx: 3, label: "DATE OF JOINING" },             // Col D
      { idx: 4, label: "GENDER" },                      // Col E
      { idx: 5, label: "FEMALE ATTENDANCE INCENTIVE" }, // Col F
      { idx: 6, label: "NIGHT SHIFT ALLOWANCE" },        // Col G
      { idx: 7, label: "FOOD ALLOWANCE" },               // Col H
      { idx: 8, label: "B SHIFT INCENTIVE" },           // Col I
      { idx: 9, label: "ACTIVE BONUS" },                // Col J
      { idx: 10, label: "HOLIDAY WORKING" },            // Col K
      { idx: 11, label: "UNNATI SCHEME" },              // Col L
      { idx: 12, label: "LOPR DAYS" },                  // Col M
      { idx: 13, label: "OT HOURS" },                   // Col N
      { idx: 14, label: "HR REMARKS" }                  // Col O
    ];

    function switchView(tabId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      const target = document.getElementById(tabId);
      if (target) target.classList.add('active');
    }

    function goBack() {
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('searchBox').style.display = 'block';
      const btn = document.getElementById('submitBtn');
      btn.disabled = false;
      btn.innerText = 'View Details';
      document.getElementById('errorNotice').style.display = 'none';
    }

    async function fetchGViz(sheetId, tab) {
      const url = "https://docs.google.com/spreadsheets/d/" + sheetId + "/gviz/tq?tqx=out:json&sheet=" + encodeURIComponent(tab);
      const res = await fetch(url);
      const txt = await res.text();
      const s = txt.indexOf('{');
      const e = txt.lastIndexOf('}');
      if (s === -1 || e === -1) {
        throw new Error('Sheet data parse nahi ho pa raha: ' + tab);
      }
      const data = JSON.parse(txt.substring(s, e + 1));
      return { cols: data.table.cols, rows: data.table.rows };
    }

    function formatCellVal(cell) {
      if (!cell) return '-';
      if (cell.f !== undefined && cell.f !== null) return cell.f;
      if (cell.v !== undefined && cell.v !== null) {
        const strVal = String(cell.v);
        if (strVal.startsWith('Date(')) {
          const parts = strVal.replace('Date(', '').replace(')', '').split(',');
          if (parts.length >= 3) {
            const y = parts[0].trim();
            const m = String(parseInt(parts[1].trim()) + 1).padStart(2, '0');
            const d = String(parts[2].trim()).padStart(2, '0');
            return `${d}-${m}-${y}`;
          }
        }
        return cell.v;
      }
      return '-';
    }

    async function runSearch() {
      const queryId = document.getElementById('empIdInput').value.trim();
      const err = document.getElementById('errorNotice');
      const btn = document.getElementById('submitBtn');

      if (!queryId) {
        err.innerText = "Kripya ID daalein!";
        err.style.display = 'block';
        return;
      }

      err.style.display = 'none';
      btn.innerText = 'Searching...';
      btn.disabled = true;

      try {
        const [otData, payData] = await Promise.all([
          fetchGViz(SHEET_OT_ID, 'Data'),
          fetchGViz(SHEET_PAY_ID, 'Sheet1')
        ]);

        let otRow = null;
        if (otData && otData.rows) {
          for (let i = 0; i < otData.rows.length; i++) {
            const r = otData.rows[i];
            if (!r || !r.c) continue;
            const c0 = String(r.c[0] ? (r.c[0].f || r.c[0].v || '') : '').trim();
            const c1 = String(r.c[1] ? (r.c[1].f || r.c[1].v || '') : '').trim();
            if (c0.toLowerCase() === queryId.toLowerCase() || c1.toLowerCase() === queryId.toLowerCase()) {
              otRow = r;
              break;
            }
          }
        }

        let payRow = null;
        if (payData && payData.rows) {
          for (let i = 0; i < payData.rows.length; i++) {
            const r = payData.rows[i];
            if (!r || !r.c) continue;
            const c0 = String(r.c[0] ? (r.c[0].f || r.c[0].v || '') : '').trim();
            const c1 = String(r.c[1] ? (r.c[1].f || r.c[1].v || '') : '').trim();
            if (c0.toLowerCase() === queryId.toLowerCase() || c1.toLowerCase() === queryId.toLowerCase()) {
              payRow = r;
              break;
            }
          }
        }

        if (!otRow && !payRow) {
          err.innerText = "Is ID ka koi record nahi mila!";
          err.style.display = 'block';
          btn.innerText = 'View Details';
          btn.disabled = false;
          return;
        }

        const name = (otRow && otRow.c && otRow.c[3] ? (otRow.c[3].f || otRow.c[3].v) : '') || 
                     (payRow && payRow.c && payRow.c[2] ? (payRow.c[2].f || payRow.c[2].v) : '') || 'Employee Details';
        document.getElementById('dispName').innerText = String(name);
        document.getElementById('dispId').innerText = "Searched ID: " + queryId;

        // Populate OT
        const otDateBody = document.getElementById('otDateWiseBody');
        let otDateHtml = '';
        let totalOtCount = 0;
        let otDaysCount = 0;

        if (otRow && otRow.c) {
          for (let i = 0; i < CYCLE_DATES.length; i++) {
            const dateLabel = CYCLE_DATES[i];
            const colIndex = 5 + i;
            const cell = otRow.c[colIndex];
            const cellVal = cell ? (cell.f !== undefined && cell.f !== null ? cell.f : (cell.v !== null && cell.v !== undefined ? cell.v : '')) : '';
            const numVal = parseFloat(cellVal) || 0;
            const isOt = numVal > 0;

            if (isOt) otDaysCount++;

            otDateHtml += '<tr class="' + (isOt ? 'has-ot' : '') + '">' +
              '<td>' + (i + 1) + '</td>' +
              '<td><strong>' + dateLabel + '</strong></td>' +
              '<td>' + (cellVal !== '' && cellVal !== 0 ? cellVal + ' Hrs' : (numVal > 0 ? numVal + ' Hrs' : '-')) + '</td>' +
              '<td>' + (isOt ? '<span class="badge-ot">OT Added</span>' : '<span style="color:#94a3b8;">-</span>') + '</td>' +
            '</tr>';
          }
          const lastCell = otRow.c[otRow.c.length - 1];
          totalOtCount = lastCell ? (lastCell.f || lastCell.v || 0) : 0;
        } else {
          otDateHtml = '<tr><td colspan="4" style="text-align:center;">Koi OverTime record nahi mila.</td></tr>';
        }

        otDateBody.innerHTML = otDateHtml;
        document.getElementById('cardOT').innerText = totalOtCount + " Hrs";
        document.getElementById('cardOTDays').innerText = otDaysCount + " Days";

        // Populate Payroll (Col A to O)
        const payHead = document.getElementById('payHead');
        const payBody = document.getElementById('payBody');

        let payH = '<tr>';
        payCols.forEach(c => { payH += '<th>' + c.label + '</th>'; });
        payH += '</tr>';
        payHead.innerHTML = payH;

        if (payRow && payRow.c) {
          let payB = '<tr>';
          payCols.forEach(c => {
            const cell = (payRow.c && payRow.c.length > c.idx) ? payRow.c[c.idx] : null;
            payB += '<td>' + formatCellVal(cell) + '</td>';
          });
          payB += '</tr>';
          payBody.innerHTML = payB;

          const getAmt = (idx) => {
            const cell = (payRow.c && payRow.c.length > idx) ? payRow.c[idx] : null;
            if (!cell) return 0;
            return cell.f !== undefined && cell.f !== null ? cell.f : (cell.v !== null && cell.v !== undefined ? cell.v : 0);
          };

          document.getElementById('cardNight').innerText = "₹" + getAmt(6);
          document.getElementById('cardFood').innerText = "₹" + getAmt(7);
          document.getElementById('cardBonus').innerText = "₹" + getAmt(9);
          document.getElementById('cardFemaleInc').innerText = "₹" + getAmt(5);
        } else {
          payBody.innerHTML = '<tr><td colspan="' + payCols.length + '" style="text-align:center;">Koi Payroll record nahi mila.</td></tr>';
          document.getElementById('cardNight').innerText = "₹0";
          document.getElementById('cardFood').innerText = "₹0";
          document.getElementById('cardBonus').innerText = "₹0";
          document.getElementById('cardFemaleInc').innerText = "₹0";
        }

        document.getElementById('searchBox').style.display = 'none';
        document.getElementById('resultBox').style.display = 'block';

      } catch (e) {
        console.error(e);
        err.innerText = "Error: Sheet data load nahi ho paya. (" + e.message + ")";
        err.style.display = 'block';
      } finally {
        btn.innerText = 'View Details';
        btn.disabled = false;
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: #0f172a; color: #1e293b; min-height: 100vh; padding: 30px 15px; }

    #searchBox { display: block; background: #ffffff; width: 100%; max-width: 420px; margin: 40px auto; padding: 32px 28px; border-radius: 16px; box-shadow: 0 20px 30px rgba(0,0,0,0.3); text-align: center; }
    #searchBox h2 { font-size: 1.5rem; font-weight: 700; color: #0f172a; }
    #searchBox p { font-size: 0.85rem; color: #64748b; margin: 6px 0 24px 0; }
    
    .input-field { margin-bottom: 16px; text-align: left; }
    .input-field label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: #334155; }
    .input-field input { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; }
    .input-field input:focus { border-color: #2563eb; }

    .btn-search { width: 100%; padding: 12px; background: #2563eb; color: #ffffff; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    .btn-search:hover { background: #1d4ed8; }
    .btn-search:disabled { background: #94a3b8; cursor: not-allowed; }
    .msg-alert { padding: 10px; border-radius: 6px; font-size: 0.85rem; text-align: center; margin-top: 14px; display: none; background: #fee2e2; color: #b91c1c; }

    #resultBox { display: none; width: 100%; max-width: 1100px; margin: 0 auto; }
    .res-header { background: #1e293b; color: #ffffff; padding: 18px 24px; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center; }
    .res-header h2 { font-size: 1.3rem; }
    .btn-back { background: #ef4444; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    .btn-back:hover { background: #dc2626; }

    .res-body { background: #ffffff; padding: 24px; border-radius: 0 0 12px 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; }
    .stat-box span { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; }
    .stat-box h3 { font-size: 1.4rem; color: #0f172a; margin-top: 6px; font-weight: 700; }

    .tab-nav { display: flex; gap: 10px; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; }
    .tab-btn { padding: 10px 20px; font-size: 0.9rem; font-weight: 600; color: #64748b; background: none; border: none; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .table-responsive { overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px; max-height: 520px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; white-space: nowrap; }
    th, td { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { background: #1e293b; color: #ffffff; font-weight: 600; position: sticky; top: 0; z-index: 5; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background: #f8fafc; }
    
    .has-ot { background-color: #ecfdf5 !important; font-weight: 600; color: #059669; }
    .badge-ot { background: #10b981; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; }

    .social-link { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: 0.85rem; font-weight: 600; color: #e1306c; margin-top: 18px; transition: opacity 0.2s; }
    .social-link:hover { opacity: 0.8; }
    .social-link i { font-size: 1.1rem; }
    .dashboard-footer { text-align: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid #e2e8f0; }
  </style>
</head>
<body>

  <!-- Search Card -->
  <div id="searchBox">
    <h2>Employee Portal</h2>
    <p>Apna data dekhne ke liye ID enter karein</p>

    <div class="input-field">
      <label>User ID / Casper ID / Vendor ID</label>
      <input type="text" id="empIdInput" placeholder="e.g. 2333480" onkeydown="if(event.key==='Enter') runSearch();" />
    </div>

    <button type="button" class="btn-search" id="submitBtn" onclick="runSearch();">View Details</button>
    <div class="msg-alert" id="errorNotice">Record nahi mila! Sahi ID daalein.</div>

    <div>
      <a href="https://www.instagram.com/wildandfree_ritvik" target="_blank" rel="noopener noreferrer" class="social-link">
        <i class="fa-brands fa-instagram"></i> Follow on Instagram
      </a>
    </div>
  </div>

  <!--
