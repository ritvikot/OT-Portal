<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Management Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; }
    body { background-color: #f1f5f9; color: #1e293b; padding: 24px 16px; }
    .container { max-width: 1300px; margin: 0 auto; }
    
    .header { background: #0f172a; color: #fff; padding: 20px 24px; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .header h1 { font-size: 1.25rem; font-weight: 600; }
    .status-badge { background: #10b981; color: #fff; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 500; }

    .controls-panel { background: #ffffff; padding: 16px 24px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .tabs { display: flex; gap: 8px; }
    .tab-btn { padding: 8px 16px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer; font-size: 0.875rem; font-weight: 600; color: #475569; transition: all 0.2s; }
    .tab-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    
    .search-box { flex: 1; max-width: 350px; position: relative; }
    .search-box input { width: 100%; padding: 8px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.875rem; outline: none; }
    .search-box input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }

    .table-card { background: #ffffff; border-radius: 0 0 12px 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07); overflow: hidden; }
    .stats-bar { padding: 10px 24px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-size: 0.8rem; color: #64748b; }
    .table-wrapper { overflow-x: auto; max-height: 650px; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; white-space: nowrap; }
    th { background: #1e293b; color: #f8fafc; font-weight: 600; padding: 12px 14px; position: sticky; top: 0; z-index: 10; }
    td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; color: #334155; }
    tr:hover td { background-color: #f8fafc; }
    tr:nth-child(even) td { background-color: #fafafa; }

    .loader { padding: 40px; text-align: center; color: #64748b; font-size: 0.95rem; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Live Workforce Portal</h1>
    <span class="status-badge">● Live Synced</span>
  </div>

  <div class="controls-panel">
    <div class="tabs">
      <button class="tab-btn active" id="btn-sheet1" onclick="switchSource('sheet1')">OverTime (MH)</button>
      <button class="tab-btn" id="btn-sheet2" onclick="switchSource('sheet2')">Payroll Output</button>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search Emp ID, Name, Department..." onkeyup="filterTable()" />
    </div>
  </div>

  <div class="table-card">
    <div class="stats-bar" id="recordCount">Loading records...</div>
    <div class="table-wrapper">
      <div id="loader" class="loader">Fetching data from Google Sheets...</div>
      <table id="dataTable" style="display:none;">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const SOURCES = {
    sheet1: {
      id: '1wL36ZedH-wVc7NVTiBzwPGTxYy-8fPCEnUebPmrMZQ0',
      tab: 'Data',
      title: 'OverTime MH'
    },
    sheet2: {
      id: '1EZm6Kyrp6h4rUBuUv0l7HHd3IRQvqT2-10xs4YzyML0',
      tab: 'Sheet1',
      title: 'Payroll Output'
    }
  };

  let currentSource = 'sheet1';

  function loadSheetData(sourceKey) {
    const loader = document.getElementById('loader');
    const table = document.getElementById('dataTable');
    loader.style.display = 'block';
    table.style.display = 'none';
    loader.innerText = 'Fetching live data...';

    const cfg = SOURCES[sourceKey];
    const url = `https://docs.google.com/spreadsheets/d/${cfg.id}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(cfg.tab)}`;

    fetch(url)
      .then(res => res.text())
      .then(raw => {
        const json = JSON.parse(raw.substring(47).slice(0, -2));
        const cols = json.table.cols;
        const rows = json.table.rows;

        const thead = document.getElementById('tableHead');
        let headHtml = '<tr>';
        cols.forEach((col, idx) => {
          headHtml += `<th>${col.label || ('Col ' + (idx + 1))}</th>`;
        });
        headHtml += '</tr>';
        thead.innerHTML = headHtml;

        const tbody = document.getElementById('tableBody');
        let bodyHtml = '';
        rows.forEach(row => {
          bodyHtml += '<tr>';
          cols.forEach((_, cIdx) => {
            const cell = row.c ? row.c[cIdx] : null;
            const val = cell ? (cell.f !== undefined ? cell.f : (cell.v !== null ? cell.v : '')) : '';
            bodyHtml += `<td>${val}</td>`;
          });
          bodyHtml += '</tr>';
        });
        tbody.innerHTML = bodyHtml;

        loader.style.display = 'none';
        table.style.display = 'table';
        document.getElementById('recordCount').innerText = `Total Records: ${rows.length}`;
        filterTable();
      })
      .catch(err => {
        loader.innerText = 'Error loading data. Google Sheet Share settings check karein.';
        console.error(err);
      });
  }

  function switchSource(sourceKey) {
    currentSource = sourceKey;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`btn-${sourceKey}`).classList.add('active');
    loadSheetData(sourceKey);
  }

  function filterTable() {
    const term = document.getElementById('searchInput').value.toLowerCase();
    const rows = document.querySelectorAll('#tableBody tr');
    let visibleCount = 0;

    rows.forEach(row => {
      const match = row.innerText.toLowerCase().includes(term);
      row.style.display = match ? '' : 'none';
      if (match) visibleCount++;
    });

    document.getElementById('recordCount').innerText = `Showing ${visibleCount} of ${rows.length} records`;
  }

  loadSheetData('sheet1');
</script>
</body>
</html>
