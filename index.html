<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee OverTime & Payroll Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: #0f172a; color: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

    /* Search / Login Card */
    .portal-card { background: #ffffff; width: 100%; max-width: 440px; padding: 32px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
    .portal-card h2 { font-size: 1.5rem; font-weight: 700; color: #0f172a; text-align: center; }
    .portal-card p { font-size: 0.85rem; color: #64748b; text-align: center; margin: 6px 0 24px 0; }
    
    .input-field { margin-bottom: 16px; }
    .input-field label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: #334155; }
    .input-field input { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; }
    .input-field input:focus { border-color: #2563eb; }

    .btn-search { width: 100%; padding: 12px; background: #2563eb; color: #ffffff; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    .btn-search:hover { background: #1d4ed8; }

    .msg-alert { padding: 10px; border-radius: 6px; font-size: 0.85rem; text-align: center; margin-top: 14px; display: none; }
    .msg-error { background: #fee2e2; color: #b91c1c; }

    /* Result Dashboard (Hidden by default) */
    .result-container { display: none; width: 100%; max-width: 1100px; }
    .res-header { background: #1e293b; color: #ffffff; padding: 20px 24px; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center; }
    .res-header h2 { font-size: 1.3rem; }
    .btn-back { background: #475569; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    .btn-back:hover { background: #334155; }

    .res-body { background: #ffffff; padding: 24px; border-radius: 0 0 12px 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; }
    .stat-box span { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; }
    .stat-box h3 { font-size: 1.3rem; color: #0f172a; margin-top: 4px; }

    .section-label { font-size: 1rem; font-weight: 700; color: #0f172a; margin: 20px 0 10px 0; border-bottom: 2px solid #f1f5f9; padding-bottom: 6px; }
    .table-box { overflow-x: auto; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; white-space: nowrap; }
    th, td { padding: 10px 14px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #0f172a; color: #ffffff; font-weight: 600; }
    tr:nth-child(even) { background: #f8fafc; }
  </style>
</head>
<body>

  <!-- 1. SEARCH / LOGIN FORM (Public screen par sirf ye dikhega) -->
  <div class="portal-card" id="searchBox">
    <h2>Employee Portal</h2>
    <p>Apna data dekhne ke liye ID enter karein</p>

    <div class="input-field">
      <label>User ID / Casper ID</label>
      <input type="text" id="empIdInput" placeholder="Enter ID (e.g. 2333480)" onkeypress="handleKey(event)" />
    </div>

    <button class="btn-search" id="submitBtn" onclick="searchRecord()">Search Details</button>
    <div class="msg-alert msg-error" id="errorNotice">Record nahi mila! Kripya sahi ID daalein.</div>
  </div>

  <!-- 2. EMPLOYEE DETAILS VIEW (Sirf Search hone par aayega) -->
  <div class="result-container" id="resultBox">
    <div class="res-header">
      <div>
        <h2 id="dispName">Employee Name</h2>
        <span id="dispId" style="color: #94a3b8; font-size: 0.85rem;"></span>
      </div>
      <button class="btn-back" onclick="goBack()">← New Search</button>
    </div>

    <div class="res-body">
      <!-- Quick Summary Cards -->
      <div class="stats-grid">
        <div class="stat-box">
          <span>Total OverTime</span>
          <h3 id="cardOT">0 Hrs</h3>
        </div>
        <div class="stat-box">
          <span>Food Allowance</span>
          <h3 id="cardFood">₹0</h3>
        </div>
        <div class="stat-box">
          <span>Night Shift Allowance</span>
          <h3 id="cardNight">₹0</h3>
        </div>
        <div class="stat-box">
          <span>Active Bonus</span>
          <h3 id="cardBonus">₹0</h3>
        </div>
      </div>

      <!-- OverTime Record -->
      <div class="section-label">OverTime Record (MH)</div>
      <div class="table-box">
        <table>
          <thead id="otHead"></thead>
          <tbody id="otBody"></tbody>
        </table>
      </div>

      <!-- Payroll Record -->
      <div class="section-label">Payroll Summary</div>
      <div class="table-box">
        <table>
          <thead id="payHead"></thead>
          <tbody id="payBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SHEET_OT_ID = '1wL36ZedH-wVc7NVTiBzwPGTxYy-8fPCEnUebPmrMZQ0';
    const SHEET_PAY_ID = '1EZm6Kyrp6h4rUBuUv0l7HHd3IRQvqT2-10xs4YzyML0';

    function handleKey(e) {
      if (e.key === 'Enter') searchRecord();
    }

    async function fetchGViz(sheetId, tab) {
      const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`;
      const res = await fetch(url);
      const txt = await res.text();
      const parsed = JSON.parse(txt.substring(47).slice(0, -2));
      return { cols: parsed.table.cols, rows: parsed.table.rows };
    }

    async function searchRecord() {
      const queryId = document.getElementById('empIdInput').value.trim();
      const err = document.getElementById('errorNotice');
      const btn = document.getElementById('submitBtn');

      if (!queryId) {
        err.innerText = "Kripya ID daalein!";
        err.style.display = 'block';
        return;
      }

      err.style.display = 'none';
      btn.innerText = 'Searching...';

      try {
        // Fetch dono sheets ka data
        const [otData, payData] = await Promise.all([
          fetchGViz(SHEET_OT_ID, 'Data'),
          fetchGViz(SHEET_PAY_ID, 'Sheet1')
        ]);

        // 1. Find OT Row
        let otRow = null;
        otData.rows.forEach(r => {
          const col0 = String(r.c[0] ? (r.c[0].f || r.c[0].v || '') : '').trim();
          const col1 = String(r.c[1] ? (r.c[1].f || r.c[1].v || '') : '').trim();
          if (col0.toLowerCase() === queryId.toLowerCase() || col1.toLowerCase() === queryId.toLowerCase()) {
            otRow = r;
          }
        });

        // 2. Find Payroll Row
        let payRow = null;
        payData.rows.forEach(r => {
          const col0 = String(r.c[0] ? (r.c[0].f || r.c[0].v || '') : '').trim();
          if (col0.toLowerCase() === queryId.toLowerCase()) {
            payRow = r;
          }
        });

        if (!otRow && !payRow) {
          err.innerText = "Is ID ka koi record nahi mila!";
          err.style.display = 'block';
          btn.innerText = 'Search Details';
          return;
        }

        // Set Name and ID Header
        const name = (otRow && otRow.c[3] ? (otRow.c[3].f || otRow.c[3].v) : '') || 
                     (payRow && payRow.c[1] ? (payRow.c[1].f || payRow.c[1].v) : '') || 'Employee Details';
        document.getElementById('dispName').innerText = name;
        document.getElementById('dispId').innerText = `Searched ID: ${queryId}`;

        // Populate OT Table & Stat
        const otHead = document.getElementById('otHead');
        const otBody = document.getElementById('otBody');
        let otH = '<tr>';
        otData.cols.forEach(c => { otH += `<th>${c.label || ''}</th>`; });
        otH += '</tr>';
        otHead.innerHTML = otH;

        if (otRow) {
          let otB = '<tr>';
          otData.cols.forEach((_, i) => {
            const cell = otRow.c[i];
            const val = cell ? (cell.f !== undefined ? cell.f : (cell.v !== null ? cell.v : '')) : '';
            otB += `<td>${val}</td>`;
          });
          otB += '</tr>';
          otBody.innerHTML = otB;

          const lastCell = otRow.c[otRow.c.length - 1];
          document.getElementById('cardOT').innerText = `${lastCell ? (lastCell.f || lastCell.v || 0) : 0} Hrs`;
        } else {
          otBody.innerHTML = '<tr><td colspan="100%" style="text-align:center;">No OverTime record found.</td></tr>';
          document.getElementById('cardOT').innerText = '0 Hrs';
        }

        // Populate Payroll Table & Stats
        const payHead = document.getElementById('payHead');
        const payBody = document.getElementById('payBody');
        let payH = '<tr>';
        payData.cols.forEach(c => { payH += `<th>${c.label || ''}</th>`; });
        payH += '</tr>';
        payHead.innerHTML = payH;

        if (payRow) {
          let payB = '<tr>';
          payData.cols.forEach((_, i) => {
            const cell = payRow.c[i];
            const val = cell ? (cell.f !== undefined ? cell.f : (cell.v !== null ? cell.v : '')) : '';
            payB += `<td>${val}</td>`;
          });
          payB += '</tr>';
          payBody.innerHTML = payB;

          document.getElementById('cardNight').innerText = `₹${payRow.c[4] ? (payRow.c[4].v || 0) : 0}`;
          document.getElementById('cardFood').innerText = `₹${payRow.c[5] ? (payRow.c[5].v || 0) : 0}`;
          document.getElementById('cardBonus').innerText = `₹${payRow.c[7] ? (payRow.c[7].v || 0) : 0}`;
        } else {
          payBody.innerHTML = '<tr><td colspan="100%" style="text-align:center;">No Payroll record found.</td></tr>';
          document.getElementById('cardNight').innerText = '₹0';
          document.getElementById('cardFood').innerText = '₹0';
          document.getElementById('cardBonus').innerText = '₹0';
        }

        // Switch View
        document.getElementById('searchBox').style.display = 'none';
        document.getElementById('resultBox').style.display = 'block';

      } catch (e) {
        console.error(e);
        err.innerText = "Error loading data. Google Sheet permissions check karein.";
        err.style.display = 'block';
      }
      btn.innerText = 'Search Details';
    }

    function goBack() {
      document.getElementById('empIdInput').value = '';
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('searchBox').style.display = 'block';
    }
  </script>
</body>
</html>
