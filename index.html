<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: #f1f5f9; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Login Box */
    .login-container { max-width: 380px; margin: auto; padding: 30px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 90%; }
    .login-container h2 { font-size: 1.4rem; margin-bottom: 8px; color: #0f172a; text-align: center; }
    .login-container p { font-size: 0.85rem; color: #64748b; margin-bottom: 20px; text-align: center; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; }
    .input-group input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none; }
    .input-group input:focus { border-color: #2563eb; }
    .btn-login { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
    .btn-login:hover { background: #1d4ed8; }
    .error-msg { color: #ef4444; font-size: 0.8rem; margin-top: 10px; text-align: center; display: none; }

    /* Dashboard */
    .dashboard { display: none; max-width: 1200px; margin: 20px auto; width: 95%; }
    .dash-header { background: #0f172a; color: #fff; padding: 16px 24px; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center; }
    .btn-logout { background: #ef4444; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    
    .dash-body { background: #fff; padding: 24px; border-radius: 0 0 12px 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; }
    .stat-card span { font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; }
    .stat-card h3 { font-size: 1.4rem; color: #0f172a; margin-top: 6px; }

    .section-title { font-size: 1.05rem; font-weight: 600; margin: 20px 0 10px 0; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; }
    .table-wrapper { overflow-x: auto; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; white-space: nowrap; }
    th, td { padding: 10px 14px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #1e293b; color: #fff; }
    tr:nth-child(even) { background: #f8fafc; }
  </style>
</head>
<body>

  <!-- Login Section -->
  <div class="login-container" id="loginBox">
    <h2>Employee Login</h2>
    <p>Apna User ID aur Password enter karein</p>
    <div class="input-group">
      <label>User ID (Casper ID)</label>
      <input type="text" id="userIdInput" placeholder="Enter ID" />
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="passInput" placeholder="Enter Password" />
    </div>
    <button class="btn-login" id="loginBtn" onclick="handleLogin()">Login</button>
    <div class="error-msg" id="errorMsg">Invalid ID or Password!</div>
  </div>

  <!-- Dashboard Section -->
  <div class="dashboard" id="dashBox">
    <div class="dash-header">
      <div>
        <h2 id="empNameDisplay">Welcome</h2>
        <small id="empIdDisplay" style="color:#94a3b8;"></small>
      </div>
      <button class="btn-logout" onclick="handleLogout()">Logout</button>
    </div>

    <div class="dash-body">
      <!-- Quick Summary Cards -->
      <div class="summary-grid">
        <div class="stat-card">
          <span>Total OverTime</span>
          <h3 id="statTotalOt">0 Hrs</h3>
        </div>
        <div class="stat-card">
          <span>Food Allowance</span>
          <h3 id="statFood">₹0</h3>
        </div>
        <div class="stat-card">
          <span>Night Shift Allowance</span>
          <h3 id="statNight">₹0</h3>
        </div>
        <div class="stat-card">
          <span>Active Bonus</span>
          <h3 id="statBonus">₹0</h3>
        </div>
      </div>

      <!-- OverTime Records -->
      <div class="section-title">OverTime Details (MH)</div>
      <div class="table-wrapper">
        <table id="otTable">
          <thead id="otHead"></thead>
          <tbody id="otBody"></tbody>
        </table>
      </div>

      <!-- Payroll Records -->
      <div class="section-title">Payroll Output</div>
      <div class="table-wrapper">
        <table id="payrollTable">
          <thead id="payrollHead"></thead>
          <tbody id="payrollBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SHEET1_ID = '1wL36ZedH-wVc7NVTiBzwPGTxYy-8fPCEnUebPmrMZQ0';
    const SHEET2_ID = '1EZm6Kyrp6h4rUBuUv0l7HHd3IRQvqT2-10xs4YzyML0';

    async function fetchGViz(sheetId, tabName) {
      const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tabName)}`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(47).slice(0, -2));
      return { cols: json.table.cols, rows: json.table.rows };
    }

    async function handleLogin() {
      const uId = document.getElementById('userIdInput').value.trim();
      const uPass = document.getElementById('passInput').value.trim();
      const err = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');

      if (!uId || !uPass) {
        err.innerText = "Dono fields fill karein.";
        err.style.display = "block";
        return;
      }

      btn.innerText = "Verifying...";
      err.style.display = "none";

      try {
        // Step 1: Verify from Users tab
        const usersData = await fetchGViz(SHEET1_ID, 'Users');
        let matchedUser = null;

        usersData.rows.forEach(r => {
          const idVal = String(r.c[0] ? (r.c[0].f || r.c[0].v || '') : '').trim();
          const passVal = String(r.c[1] ? (r.c[1].f || r.c[1].v || '') : '').trim();
          const nameVal = r.c[2] ? (r.c[2].f || r.c[2].v || '') : '';

          if (idVal.toLowerCase() === uId.toLowerCase() && passVal === uPass) {
            matchedUser = { id: idVal, name: nameVal };
          }
        });

        if (!matchedUser) {
          err.innerText = "Galat User ID ya Password!";
          err.style.display = "block";
          btn.innerText = "Login";
          return;
        }

        // Step 2: Fetch Data for this specific user
        await loadUserData(matchedUser);

        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('dashBox').style.display = 'block';
      } catch (e) {
        console.error(e);
        err.innerText = "Data load karne me problem aayi. Sheet settings check karein.";
        err.style.display = "block";
      }
      btn.innerText = "Login";
    }

    async function loadUserData(user) {
      document.getElementById('empNameDisplay').innerText = user.name || 'Employee';
      document.getElementById('empIdDisplay').innerText = `User ID: ${user.id}`;

      // 1. Fetch OverTime Sheet Data
      const otData = await fetchGViz(SHEET1_ID, 'Data');
      const otHead = document.getElementById('otHead');
      const otBody = document.getElementById('otBody');

      let otHeadRow = '<tr>';
      otData.cols.forEach(c => { otHeadRow += `<th>${c.label || ''}</th>`; });
      otHeadRow += '</tr>';
      otHead.innerHTML = otHeadRow;

      let userOtRow = null;
      otData.rows.forEach(r => {
        const rowId = String(r.c[0] ? (r.c[0].f || r.c[0].v || '') : '').trim();
        if (rowId.toLowerCase() === user.id.toLowerCase()) {
          userOtRow = r;
        }
      });

      if (userOtRow) {
        let bodyHtml = '<tr>';
        otData.cols.forEach((_, idx) => {
          const cell = userOtRow.c[idx];
          const val = cell ? (cell.f !== undefined ? cell.f : (cell.v !== null ? cell.v : '')) : '';
          bodyHtml += `<td>${val}</td>`;
        });
        bodyHtml += '</tr>';
        otBody.innerHTML = bodyHtml;

        // Last column as Total OT
        const lastCell = userOtRow.c[userOtRow.c.length - 1];
        document.getElementById('statTotalOt').innerText = `${lastCell ? (lastCell.f || lastCell.v || 0) : 0} Hrs`;
      } else {
        otBody.innerHTML = '<tr><td colspan="100%" style="text-align:center;">No OverTime record found.</td></tr>';
      }

      // 2. Fetch Payroll Sheet Data
      const payData = await fetchGViz(SHEET2_ID, 'Sheet1');
      const payrollHead = document.getElementById('payrollHead');
      const payrollBody = document.getElementById('payrollBody');

      let payHeadRow = '<tr>';
      payData.cols.forEach(c => { payHeadRow += `<th>${c.label || ''}</th>`; });
      payHeadRow += '</tr>';
      payrollHead.innerHTML = payHeadRow;

      let userPayRow = null;
      payData.rows.forEach(r => {
        const rowId = String(r.c[0] ? (r.c[0].f || r.c[0].v || '') : '').trim();
        if (rowId.toLowerCase() === user.id.toLowerCase()) {
          userPayRow = r;
        }
      });

      if (userPayRow) {
        let bodyHtml = '<tr>';
        payData.cols.forEach((_, idx) => {
          const cell = userPayRow.c[idx];
          const val = cell ? (cell.f !== undefined ? cell.f : (cell.v !== null ? cell.v : '')) : '';
          bodyHtml += `<td>${val}</td>`;
        });
        bodyHtml += '</tr>';
        payrollBody.innerHTML = bodyHtml;

        // Match indexes based on Payroll sheet headers
        document.getElementById('statNight').innerText = `₹${userPayRow.c[4] ? (userPayRow.c[4].v || 0) : 0}`;
        document.getElementById('statFood').innerText = `₹${userPayRow.c[5] ? (userPayRow.c[5].v || 0) : 0}`;
        document.getElementById('statBonus').innerText = `₹${userPayRow.c[7] ? (userPayRow.c[7].v || 0) : 0}`;
      } else {
        payrollBody.innerHTML = '<tr><td colspan="100%" style="text-align:center;">No Payroll record found.</td></tr>';
      }
    }

    function handleLogout() {
      document.getElementById('userIdInput').value = '';
      document.getElementById('passInput').value = '';
      document.getElementById('dashBox').style.display = 'none';
      document.getElementById('loginBox').style.display = 'block';
    }
  </script>
</body>
</html>
